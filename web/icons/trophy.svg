<!-- App icon source: World Cup 2026 brand palette (navy field, red base bar,
     gold trophy). Full-bleed background so it doubles as a maskable icon —
     the trophy sits well inside the central 80% safe zone. Regenerate the PNG
     sizes in web/public/ with `node scripts/gen-icons.mjs`. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#003087"/>
  <rect y="468" width="512" height="44" fill="#C8102E"/>
  <g fill="#FDB913">
    <!-- cup bowl -->
    <path d="M168 108 h176 v44 c0 64 -40 108 -88 108 s-88 -44 -88 -108 Z"/>
    <!-- stem + base -->
    <rect x="244" y="256" width="24" height="44"/>
    <path d="M214 300 h84 l16 30 h-116 Z"/>
    <rect x="196" y="330" width="120" height="30" rx="6"/>
  </g>
  <!-- handles -->
  <g fill="none" stroke="#FDB913" stroke-width="18" stroke-linecap="round">
    <path d="M168 124 c-44 0 -56 64 -8 84"/>
    <path d="M344 124 c44 0 56 64 8 84"/>
  </g>
  <!-- star on the cup -->
  <path fill="#003087" d="M256 150 l11 24 26 3 -19 18 5 26 -23 -13 -23 13 5 -26 -19 -18 26 -3 Z"/>
</svg>
